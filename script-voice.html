<script>
  /**
   * @module script-voice
   * @description 語音模組：多語言語音播放（英文/日文/中文）、字母拼讀、
   *   語音等待機制（確保播放完成後再切換）、語音開關、語音設定 UI。
   *   導覽（nextWord/previousWord）→ script-display.html
   *   全螢幕 → script-events.html
   *   暫停控制 → script-display.html
   *
   * @dependencies script-core.html (FlashcardApp, APP_CONSTANTS)
   * @provides FlashcardApp.prototype: speakWord, speakEnglishWord,
   *   speakJapaneseWord, speakChineseWord, waitForSpeechThenExecute,
   *   toggleVoice, openVoiceSettings, populateVoiceSelect ...
   */

  /**
   * 判斷「目前這張卡片的英文單字」是否應該逐字母拼讀。
   * 依 voiceSettings.spellOutLetters（總開關）與 voiceSettings.spellOutScope（範圍）決定：
   *   - 'all'                → 所有單字都拼讀
   *   - 'must-spell-all'     → 只拼讀所有要會拼單字（隨機 0.5 + 衝刺 1）
   *   - 'must-spell-random'  → 只拼讀隨機要會拼單字（0.5）
   *   - 'must-spell-sprint'  → 只拼讀衝刺要會拼單字（1）
   * @returns {boolean}
   */
  FlashcardApp.prototype._shouldSpellOutCurrentWord = function() {
    if (!this.voiceSettings.enabled || !this.voiceSettings.spellOutLetters) return false;
    var scope = this.voiceSettings.spellOutScope || 'all';
    if (scope === 'all') return true;
    var currentWord = this.currentWords ? this.currentWords[this.currentIndex] : null;
    var ms = currentWord ? this.normalizeMustSpell(currentWord.mustSpell) : 0;
    if (scope === 'must-spell-all') return ms === 1 || ms === 0.5;
    if (scope === 'must-spell-random') return ms === 0.5;
    if (scope === 'must-spell-sprint') return ms === 1;
    return true;
  };

  // 檢測日文字符
  FlashcardApp.prototype.isJapaneseText = function(text) {
    if (!text) return false;
    
    // 日文字符範圍：
    // 平假名: \u3040-\u309f
    // 片假名: \u30a0-\u30ff
    // 漢字: \u4e00-\u9faf
    // 全角標點: \u3000-\u303f
    var japanesePattern = /[\u3040-\u309f\u30a0-\u30ff\u4e00-\u9faf\u3000-\u303f]/;
    
    return japanesePattern.test(text);
  };

  // 逐字母拼讀英文單字
  FlashcardApp.prototype.speakEnglishLetters = function(text, callback) {
    if (!this.voiceSettings.enabled || !this.voiceSettings.spellOutLetters) {
      if (callback) callback();
      return;
    }
    if (!text) {
      if (callback) callback();
      return;
    }
    
    // 舊版瀏覽器檢查用戶交互狀態
    if (this.isLegacyBrowser && !this.speechActivated) {
      console.log('舊版瀏覽器：語音未啟用，跳過字母拼讀');
      if (callback) callback();
      return;
    }

    // iPadOS Safari 26.4 限定：手勢前呼叫 speak() 會永久污染語音引擎
    if (this._needsTapToStart && !this._userGestureSeen) {
      console.log('字母拼讀略過：使用者尚未產生第一個手勢 (iPad)');
      if (callback) callback();
      return;
    }
    
    try {
      // 提取純英文字母
      var letters = [];
      for (var i = 0; i < text.length; i++) {
        var char = text.charAt(i);
        if (/[a-zA-Z]/.test(char)) {
          letters.push(char.toLowerCase());
        }
      }
      
      if (letters.length === 0) {
        if (callback) callback();
        return;
      }
      
      console.log('拼讀字母:', letters.join('-'));
      
      var self = this;
      var currentLetterIndex = 0;
      var playId = this._speechPlayId || 0;
      
      // 遞迴函數：逐個唸字母
      var speakNextLetter = function() {
        // 已被 cancel / P 鍵等新播放取代 → 停止後續字母與 callback
        if ((self._speechPlayId || 0) !== playId) return;
        if (currentLetterIndex >= letters.length) {
          // 所有字母都唸完了，執行回調
          if (callback) {
            setTimeout(function() {
              if ((self._speechPlayId || 0) !== playId) return;
              callback();
            }, APP_CONSTANTS.SPELL_LETTER_GAP_MS); // 字母拼讀和單字發音之間留一點間隔
          }
          return;
        }
        
        var letter = letters[currentLetterIndex];
        var utterance = new SpeechSynthesisUtterance(letter);
        utterance.rate = 1; // 英文字母簡單易懂，固定使用正常速度
        utterance.pitch = self.voiceSettings.pitch;
        utterance.volume = self.voiceSettings.volume;
        utterance.lang = self.voiceSettings.lang;
        
        // 選擇語音
        var voices = self.speechSynthesis.getVoices();
        var selectedVoice = null;
        if (self.voiceSettings.voiceURI) {
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].voiceURI === self.voiceSettings.voiceURI) {
              selectedVoice = voices[i];
              break;
            }
          }
        }
        
        if (!selectedVoice) {
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang.indexOf('en-') === 0) {
              selectedVoice = voices[i];
              break;
            }
          }
        }
        
        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }
        
        // 當這個字母唸完後，繼續下一個
        utterance.onend = function() {
          currentLetterIndex++;
          setTimeout(speakNextLetter, 10); // 字母之間間隔10ms
        };
        
        utterance.onerror = function(event) {
          console.log('字母拼讀錯誤:', event.error);
          // cancel 導致 interrupted：不要繼續拼讀
          if ((self._speechPlayId || 0) !== playId) return;
          currentLetterIndex++;
          setTimeout(speakNextLetter, 10);
        };
        
        self.speechSynthesis.speak(utterance);
      };
      
      speakNextLetter();
      
    } catch (error) {
      console.log('字母拼讀失敗:', error);
      if (callback) callback();
    }
  };

  // 衝刺要會拼單字（mustSpell === 1）專用拼讀：
  // 把單字拆成「中間有空格」的字串（例如 breakfast → b r e a k f a s t），
  // 以「單一」語音一次唸出，靠空格自然停頓；速度夠快又舒服，取代逐字母個別發音。
  FlashcardApp.prototype.speakEnglishLettersSpaced = function(text, callback) {
    if (!this.voiceSettings.enabled || !this.voiceSettings.spellOutLetters) {
      if (callback) callback();
      return;
    }
    if (!text) {
      if (callback) callback();
      return;
    }

    // 舊版瀏覽器檢查用戶交互狀態
    if (this.isLegacyBrowser && !this.speechActivated) {
      console.log('舊版瀏覽器：語音未啟用，跳過拆字發音');
      if (callback) callback();
      return;
    }

    // iPadOS Safari 26.4 限定：手勢前呼叫 speak() 會永久污染語音引擎
    if (this._needsTapToStart && !this._userGestureSeen) {
      console.log('拆字發音略過：使用者尚未產生第一個手勢 (iPad)');
      if (callback) callback();
      return;
    }

    try {
      // 提取純英文字母，以空格串接（例如 breakfast → b r e a k f a s t）
      var letters = [];
      for (var i = 0; i < text.length; i++) {
        var char = text.charAt(i);
        if (/[a-zA-Z]/.test(char)) {
          letters.push(char.toLowerCase());
        }
      }

      if (letters.length === 0) {
        if (callback) callback();
        return;
      }

      var spaced = letters.join(' ');
      console.log('拆字發音:', spaced);

      var self = this;
      var playId = this._speechPlayId || 0;

      var utterance = new SpeechSynthesisUtterance(spaced);
      utterance.rate = 1; // 字母以正常速度連續唸出，靠空格自然停頓
      utterance.pitch = this.voiceSettings.pitch;
      utterance.volume = this.voiceSettings.volume;
      utterance.lang = this.voiceSettings.lang;

      // 選擇語音（與逐字母拼讀相同：優先使用者指定的英文語音）
      var voices = this.speechSynthesis.getVoices();
      var selectedVoice = null;
      if (this.voiceSettings.voiceURI) {
        for (var j = 0; j < voices.length; j++) {
          if (voices[j].voiceURI === this.voiceSettings.voiceURI) {
            selectedVoice = voices[j];
            break;
          }
        }
      }
      if (!selectedVoice) {
        for (var k = 0; k < voices.length; k++) {
          if (voices[k].lang.indexOf('en-') === 0) {
            selectedVoice = voices[k];
            break;
          }
        }
      }
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }

      utterance.onend = function() {
        if (callback) {
          setTimeout(function() {
            // 已被 cancel / P 鍵等新播放取代 → 勿再觸發完整單字發音
            if ((self._speechPlayId || 0) !== playId) return;
            callback();
          }, APP_CONSTANTS.SPELL_LETTER_GAP_MS); // 拆字與單字發音之間留一點間隔
        }
      };

      utterance.onerror = function(event) {
        console.log('拆字發音錯誤:', event.error);
        // cancel 導致 interrupted：不要再 callback（否則會打斷剛按下的 P 發音）
        if ((self._speechPlayId || 0) !== playId) return;
        if (callback) callback();
      };

      this.speechSynthesis.speak(utterance);

    } catch (error) {
      console.log('拆字發音失敗:', error);
      if (callback) callback();
    }
  };

  // 語音播放（英文單字）
  FlashcardApp.prototype.speakEnglishWord = function(text) {
    if (!this.voiceSettings.enabled) return;
    if (!text) return;
    
    // 舊版瀏覽器檢查用戶交互狀態
    if (this.isLegacyBrowser && !this.speechActivated) {
      console.log('舊版瀏覽器：語音未啟用，跳過播放');
      return;
    }

    // iPadOS Safari 26.4 限定：手勢前 speak() 會永久污染語音引擎，徹底跳過
    if (this._needsTapToStart && !this._userGestureSeen) {
      console.log('英文語音略過：使用者尚未產生第一個手勢 (iPad)');
      this._speechSequenceActive = false;
      return;
    }

    var self = this;
    var playId = this._speechPlayId || 0;
    
    // 如果啟用了字母拼讀且目前單字在拼讀範圍內，先拼讀字母，然後再唸單字
    if (this._shouldSpellOutCurrentWord()) {
      // 標記語音序列開始（拼讀 + 單字發音），防止中途被切換
      this._speechSequenceActive = true;
      // 要會拼單字（衝刺 mustSpell === 1、隨機 mustSpell === 0.5）改用「拆字後單一發音」
      // （b r e a k f a s t），速度快又自然；其餘單字維持逐字母個別拼讀。
      var currentWord = this.currentWords ? this.currentWords[this.currentIndex] : null;
      var ms = currentWord ? this.normalizeMustSpell(currentWord.mustSpell) : 0;
      var useSpaced = (ms === 1 || ms === 0.5);
      var spellOutFn = useSpaced ? this.speakEnglishLettersSpaced : this.speakEnglishLetters;
      spellOutFn.call(this, text, function() {
        // 拼讀期間若已被 cancel / P 鍵取代，略過完整單字發音
        if ((self._speechPlayId || 0) !== playId) return;
        self.speakEnglishWordOnly(text);
      });
    } else {
      // 直接唸單字
      this.speakEnglishWordOnly(text);
    }
  };

  // 只唸英文單字（不拼讀字母）
  FlashcardApp.prototype.speakEnglishWordOnly = function(text) {
    if (!this.voiceSettings.enabled) return;
    if (!text) return;

    // iPadOS Safari 26.4 限定：手勢前 speak() 會永久污染語音引擎，徹底跳過
    if (this._needsTapToStart && !this._userGestureSeen) {
      console.log('英文語音略過：使用者尚未產生第一個手勢 (iPad)');
      return;
    }

    try {
      console.log('播放英文語音:', text);
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = (this._speechRateOverride !== null && this._speechRateOverride !== undefined)
        ? this._speechRateOverride
        : this.voiceSettings.rate;
      // 一次性覆寫：套用到 utterance 後立刻清除，避免影響後續自動發音
      // （P 鍵慢速需保留到字母拼讀非同步完成後才進到這裡）
      this._speechRateOverride = null;
      utterance.pitch = this.voiceSettings.pitch;
      utterance.volume = this.voiceSettings.volume;
      utterance.lang = this.voiceSettings.lang;
      
      var voices = this.speechSynthesis.getVoices();
      var selectedVoice = null;
      if (this.voiceSettings.voiceURI) {
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].voiceURI === this.voiceSettings.voiceURI) {
            selectedVoice = voices[i];
            break;
          }
        }
      }
      
      if (!selectedVoice) {
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang.indexOf('en-') === 0 || 
              voices[i].name.toLowerCase().indexOf('english') !== -1) {
            selectedVoice = voices[i];
            break;
          }
        }
      }
      
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }
      
      var self = this;
      
      // 為舊版瀏覽器添加錯誤處理
      utterance.onerror = function(event) {
        console.log('英文語音播放錯誤:', event.error);
        self._speechSequenceActive = false;
      };
      
      utterance.onstart = function() {
        console.log('英文語音開始播放:', text);
      };
      
      utterance.onend = function() {
        self._speechSequenceActive = false;
      };
      
      this.speechSynthesis.speak(utterance);
    } catch (error) {
      console.log('英文語音播放失敗:', error);
      this._speechSequenceActive = false;
    }
  };
  
  // 日文語音播放
  FlashcardApp.prototype.speakJapaneseWord = function(text) {
    if (!this.voiceSettings.enabled) return;
    if (!text) return;
    
    // 舊版瀏覽器檢查用戶交互狀態
    if (this.isLegacyBrowser && !this.speechActivated) {
      console.log('舊版瀏覽器：語音未啟用，跳過播放');
      return;
    }

    // iPadOS Safari 26.4 限定：手勢前 speak() 會永久污染語音引擎，徹底跳過
    if (this._needsTapToStart && !this._userGestureSeen) {
      console.log('日文語音略過：使用者尚未產生第一個手勢 (iPad)');
      return;
    }

    try {
      console.log('播放日文語音:', text);
      this.speechSynthesis.cancel();
      
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = (this._speechRateOverride !== null && this._speechRateOverride !== undefined)
        ? this._speechRateOverride
        : this.voiceSettings.rate;
      // 一次性覆寫：套用到 utterance 後立刻清除（與英文路徑相同）
      this._speechRateOverride = null;
      utterance.pitch = this.voiceSettings.pitch;
      utterance.volume = this.voiceSettings.volume;
      utterance.lang = this.voiceSettings.japaneseLang;
      
      var voices = this.speechSynthesis.getVoices();
      var selectedVoice = null;
      if (this.voiceSettings.japaneseVoiceURI) {
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].voiceURI === this.voiceSettings.japaneseVoiceURI) {
            selectedVoice = voices[i];
            break;
          }
        }
      }
      
      if (!selectedVoice) {
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang.indexOf('ja-') === 0 || 
              voices[i].name.toLowerCase().indexOf('japanese') !== -1) {
            selectedVoice = voices[i];
            break;
          }
        }
      }
      
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }
      
      // 為舊版瀏覽器添加錯誤處理
      utterance.onerror = function(event) {
        console.log('日文語音播放錯誤:', event.error);
      };
      
      utterance.onstart = function() {
        console.log('日文語音開始播放:', text);
      };
      
      this.speechSynthesis.speak(utterance);
    } catch (error) {
      console.log('日文語音播放失敗:', error);
    }
  };
  
  // 中文語音播放
  FlashcardApp.prototype.speakChineseWord = function(text) {
    if (!this.voiceSettings.chineseEnabled) return;
    if (!text) return;
    
    // 舊版瀏覽器檢查用戶交互狀態
    if (this.isLegacyBrowser && !this.speechActivated) {
      console.log('舊版瀏覽器：語音未啟用，跳過播放');
      return;
    }

    // iPadOS Safari 26.4 限定：手勢前 speak() 會永久污染語音引擎，徹底跳過
    if (this._needsTapToStart && !this._userGestureSeen) {
      console.log('中文語音略過：使用者尚未產生第一個手勢 (iPad)');
      return;
    }

    var self = this;
    
    // 清理之前的等待定時器（如果存在）
    if (this.chineseWaitInterval) {
      clearInterval(this.chineseWaitInterval);
      this.chineseWaitInterval = null;
    }
    
    // 如果正在播放英文或日文語音（包括字母拼讀），等待播放完成
    if (this.speechSynthesis.speaking) {
      console.log('等待英文/日文語音播放完成後再播放中文...');
      
      // 使用輪詢檢查語音是否播放完成
      this.chineseWaitInterval = setInterval(function() {
        if (!self.speechSynthesis.speaking) {
          clearInterval(self.chineseWaitInterval);
          self.chineseWaitInterval = null;
          console.log('英文/日文語音播放完成，現在播放中文');
          self.speakChineseWordNow(text);
        }
      }, APP_CONSTANTS.CHINESE_SPEECH_POLL_MS);
      
      return;
    }
    
    // 如果沒有語音正在播放，直接播放中文
    this.speakChineseWordNow(text);
  };
  
  // 立即播放中文語音（內部函數）
  FlashcardApp.prototype.speakChineseWordNow = function(text) {
    if (!text) return;
    
    try {
      console.log('播放中文語音:', text);
      
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1; // 中文為母語，固定使用正常速度
      utterance.pitch = this.voiceSettings.pitch;
      utterance.volume = this.voiceSettings.volume;
      utterance.lang = this.voiceSettings.chineseLang;
      
      var voices = this.speechSynthesis.getVoices();
      var selectedVoice = null;
      if (this.voiceSettings.chineseVoiceURI) {
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].voiceURI === this.voiceSettings.chineseVoiceURI) {
            selectedVoice = voices[i];
            break;
          }
        }
      }
      
      if (!selectedVoice) {
        for (var i = 0; i < voices.length; i++) {
          if (voices[i].lang.indexOf('zh-') === 0 || 
              voices[i].name.toLowerCase().indexOf('chinese') !== -1) {
            selectedVoice = voices[i];
            break;
          }
        }
      }
      
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }
      
      // 為舊版瀏覽器添加錯誤處理
      utterance.onerror = function(event) {
        console.log('中文語音播放錯誤:', event.error);
      };
      
      utterance.onstart = function() {
        console.log('中文語音開始播放:', text);
      };
      
      this.speechSynthesis.speak(utterance);
    } catch (error) {
      console.log('中文語音播放失敗:', error);
    }
  };
  
  // 檢測 KK 音標字串（/.../ 格式，如 /m/、/aɪ/、/tʃ/）
  FlashcardApp.prototype.isKKPhoneticText = function(text) {
    if (!text) return false;
    var t = String(text).trim();
    if (t.length < 3 || t.charAt(0) !== '/' || t.charAt(t.length - 1) !== '/') return false;
    var inner = t.slice(1, -1);
    if (!inner) return false;
    // 內容須全部是音標字元（拉丁/IPA 擴充/希臘 θ/組合符號/修飾符號/空白/標點），
    // 排除 /path/to/file 這類普通字串與一般英文句子
    return /^[0-9a-zA-Z\u00c0-\u024f\u0250-\u02af\u0370-\u03ff\u0300-\u036f\u02b0-\u02ff ːˑ.,!?-]*$/.test(inner);
  };

  // 智能語音播放（自動檢測語言 - 僅用於英文/日文單字）
  FlashcardApp.prototype.speakWord = function(text) {
    if (!text) return;
    
    if (this.isKKPhoneticText(text)) {
      // KK 音標卡（/.../）：轉成可發音文字後用英文語音播放
      this.speakKKPhonetic(text);
    } else if (this.isJapaneseText(text)) {
      // 文本包含日文字符，使用日文語音
      this.speakJapaneseWord(text);
    } else {
      // 文本為英文，使用英文語音（可能包含字母拼讀）
      this.speakEnglishWord(text);
    }
  };

  /**
   * KK 音標發音：把 IPA 符號轉換成 TTS 引擎能「唸出近音」的文字，
   * 真人音檔優先：Wikimedia Commons 的 IPA 音素真人錄音（託管於
   * akwangho.github.io/kk-audio/，41 個符號與 KK 音標閃卡一一對應），
   * 音檔載入失敗才退回 TTS「近音拼法」。
   *
   * TTS 後備品質說明：瀏覽器 TTS 不支援 IPA 輸入，近音拼法為近似發音，
   * 長母音以 h 結尾（ee→eeh）拉長聽感。
   * @param {string} text - KK 音標字串（/.../）
   */
  /** KK 音標真人發音音檔 URL（與 data/kk-flashcards.json 的 41 個音標一致）。
   *  來源：吉娜英文 KK 音標課程的美國老師錄音（39 個）+ Wikimedia Commons（/i/ /ɪ/）。 */
  var KK_AUDIO_BASE_URL = 'https://akwangho.github.io/kk-audio/';

  FlashcardApp.prototype.speakKKPhonetic = function(text) {
    if (!this.voiceSettings.enabled) return;
    if (!text) return;

    var inner = String(text).trim().replace(/^\/+/, '').replace(/\/+$/, '').trim();
    if (!inner) return;

    if (this._playKKAudioClips(inner)) return; // 真人音檔優先

    // 後備：音檔無法播放（離線/CDN 異常/不支援）→ TTS 近音拼法
    var speakable = this._kkToSpeakableText(inner);
    if (!speakable) return;

    console.log('播放 KK 音標（TTS 近音後備）:', text, '→', speakable);
    this.speakEnglishWordOnly(speakable);
  };

  /**
   * 決定音檔副檔名（惰性，每次 session 只探測一次）：
   * 支援 Opus 的瀏覽器用 .ogg（比 mp3 小 61%），否則用 .mp3。
   * @param {string} sym - 音標符號或組成音
   * @returns {string} 完整音檔 URL
   */
  FlashcardApp.prototype._kkAudioUrl = function(sym) {
    if (!this._kkAudioExt) {
      var probe = document.createElement('audio');
      var can = probe.canPlayType ? probe.canPlayType('audio/ogg; codecs="opus"') : '';
      this._kkAudioExt = can ? '.ogg' : '.mp3';
    }
    return KK_AUDIO_BASE_URL + encodeURIComponent(sym) + this._kkAudioExt;
  };

  /**
   * 播放 KK 音標真人音檔（41 個音標都有單一音檔）。
   * 格式策略：.ogg(Opus) 優先 → 載入失敗重試 .mp3 → 仍失敗（離線/CDN 異常）退 TTS。
   * @param {string} inner - 音標內容（不含斜線）
   * @returns {boolean} 是否成功開始播放（false = 呼叫端退回 TTS）
   */
  FlashcardApp.prototype._playKKAudioClips = function(inner) {
    var audio = this._kkAudioPlayer || (this._kkAudioPlayer = new Audio());
    var self = this;

    audio.onended = null;
    /** ogg 失敗 → 降級 mp3 重播；mp3 也失敗（離線/CDN 異常）→ TTS 近音後備 */
    function handleKKAudioError() {
      if (self._kkAudioExt === '.ogg') {
        self._kkAudioExt = '.mp3';
        audio.onerror = handleKKAudioError;
        audio.src = self._kkAudioUrl(inner);
        audio.play();
        return;
      }
      audio.onerror = null;
      var speakable = self._kkToSpeakableText(inner);
      if (speakable) self.speakEnglishWordOnly(speakable);
    }
    audio.onerror = handleKKAudioError;
    audio.src = this._kkAudioUrl(inner);
    var p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function() { audio.onerror = null; }); // 自動播放被攔：靜默放棄，不退回 TTS
    }
    return true;
  };

  /**
   * IPA → 可發音英文拼法轉換（與 code.gs 的字庫轉換規則對應的 KK 符號集）。
   *
   * 兩種模式：
   *   1. 單一音標（41 張 KK 音標卡的實際使用場景）：
   *      子音用「老師唸單音」的拼法（b → buh、θ → thuh），
   *      母音用獨立字拼法（aɪ → eye、i → ee、e → ay）——TTS 唸出來最接近單獨的音。
   *   2. 多音標組合（如 ˋtwɛntiˏfaɪv）：單次掃描（single-pass）逐符號換成 in-word 拼法
   *      （dʒ→j、aɪ→y、ɪ→i、ʌ→u...），品質為近似。
   *
   * 品質說明：瀏覽器 TTS 不支援直接輸入 IPA，此為「近似發音」策略，
   * 目標是讓孩子聽到可辨識的近似音。
   * @param {string} inner - 音標內容（不含斜線）
   * @returns {string} 可交給英文 TTS 的近似音文字
   */
  FlashcardApp.prototype._kkToSpeakableText = function(inner) {
    if (!inner) return '';
    var s = String(inner).trim();
    if (!s) return '';

    // 單一音標：查專用對照表（41 張卡片的场景，品質最好）
    if (FlashcardApp.KK_SINGLE_SYMBOL_MAP[s]) {
      return FlashcardApp.KK_SINGLE_SYMBOL_MAP[s];
    }

    // 多音標組合：先正規化（重音→空白、長音清除），再單次掃描替換
    s = s.replace(/[ˈˌˏ]/g, ' ').replace(/ː/g, '');

    var keys = Object.keys(FlashcardApp.KK_INWORD_MAP).sort(function(a, b) {
      return b.length - a.length;
    });
    var combined = new RegExp('(' + keys.map(function(k) {
      return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }).join('|') + ')', 'g');
    var map = FlashcardApp.KK_INWORD_MAP;
    var PLACE = '\u0001';
    s = s.replace(combined, function(m) { return PLACE + map[m] + PLACE; });

    // 清理：佔位符→空白（避免相鄰轉換結果黏成怪字）、壓縮空白、移除殘留非英文字元
    s = s.split(PLACE).join(' ');
    s = s.replace(/\s+/g, ' ').trim();
    s = s.replace(/[^a-zA-Z ]/g, '');

    return s.trim();
  };

  /** 單一音標 → 獨立發音拼法（子音「+uh」模仿老師唸單音；母音用讀音最接近的獨立字） */
  FlashcardApp.KK_SINGLE_SYMBOL_MAP = {
    'p': 'puh', 'b': 'buh', 't': 'tuh', 'd': 'duh',
    'k': 'kuh', 'g': 'guh', 'f': 'fuh', 'v': 'vuh',
    'm': 'muh', 'n': 'nuh', 'l': 'luh', 'r': 'ruh',
    's': 'suh', 'z': 'zuh', 'h': 'huh', 'w': 'wuh',
    'ŋ': 'ung', 'θ': 'thuh', 'ð': 'the', 'ʃ': 'shh', 'ʒ': 'zhuh',
    'tʃ': 'chuh', 'dʒ': 'juh', 'j': 'yuh',
    'i': 'ee', 'ɪ': 'ih', 'e': 'ay', 'ɛ': 'eh',
    'æ': 'aa', 'ɑ': 'ah', 'ʌ': 'uh', 'ə': 'uh',
    'ɔ': 'aw', 'o': 'oh', 'ʊ': 'oo', 'u': 'ooh',
    'ɚ': 'er', 'ɝ': 'er', 'ɜ': 'er',
    'aɪ': 'eye', 'aʊ': 'ow', 'ɔɪ': 'oy'
  };

  /** 多音標組合用：in-word 近似拼法（單次掃描，不回掃輸出） */
  FlashcardApp.KK_INWORD_MAP = {
    'dʒ': 'j', 'tʃ': 'ch',
    'aɪ': 'y', 'aʊ': 'ow', 'ɔɪ': 'oy',
    'ɚ': 'er', 'ɝ': 'er', 'ɜ': 'er',
    'i': 'ee', 'ɪ': 'i', 'e': 'ay', 'ɛ': 'e',
    'æ': 'a', 'ɑ': 'o', 'ʌ': 'u', 'ə': 'a',
    'ɔ': 'aw', 'o': 'oh', 'ʊ': 'oo', 'u': 'oo',
    'ŋ': 'ng', 'θ': 'th', 'ð': 'th', 'ʃ': 'sh', 'ʒ': 'zh',
    'ɡ': 'g', 'j': 'y'
  };
  
  // 清除語音等待計時器
  FlashcardApp.prototype.clearSpeechWait = function() {
    if (this._speechWaitInterval) {
      clearInterval(this._speechWaitInterval);
      this._speechWaitInterval = null;
    }
    if (this._speechWaitTimeout) {
      clearTimeout(this._speechWaitTimeout);
      this._speechWaitTimeout = null;
    }
  };

  // 等待語音播放完成後才執行回調（確保字母拼讀和中文語音不會被中途打斷）
  FlashcardApp.prototype.waitForSpeechThenExecute = function(callback) {
    var self = this;
    
    // 清除之前的等待
    this.clearSpeechWait();
    
    // 檢查是否有任何語音功能啟用（英日文發音或中文發音）
    var hasVoice = this.voiceSettings.enabled;
    var hasChinese = this.voiceSettings.chineseEnabled;
    
    if (!hasVoice && !hasChinese) {
      callback();
      return;
    }
    
    // 檢查是否有語音正在播放或等待中
    var isSpeaking = false;
    try {
      isSpeaking = this.speechSynthesis.speaking || !!this.chineseWaitInterval || this._speechSequenceActive;
    } catch (e) {
      // 語音 API 不可用時直接執行回調
      callback();
      return;
    }
    
    if (!isSpeaking) {
      callback();
      return;
    }
    
    console.log('語音仍在播放中，等待完成後再切換...');
    
    // 輪詢等待語音播放完成
    this._speechWaitInterval = setInterval(function() {
      var stillSpeaking = false;
      try {
        stillSpeaking = self.speechSynthesis.speaking || !!self.chineseWaitInterval || self._speechSequenceActive;
      } catch (e) {
        stillSpeaking = false;
      }
      
      if (!stillSpeaking) {
        self.clearSpeechWait();
        // 語音播放完成後，短暫延遲再執行回調
        setTimeout(function() {
          if (!self.isPaused) {
            callback();
          }
        }, APP_CONSTANTS.TRANSITION_DELAY_MS);
      }
    }, APP_CONSTANTS.SPEECH_WAIT_POLL_MS);
    
    // 安全超時：避免永遠卡住
    this._speechWaitTimeout = setTimeout(function() {
      console.log('語音等待超時（' + APP_CONSTANTS.SPEECH_WAIT_TIMEOUT_MS + 'ms），強制執行切換');
      self.clearSpeechWait();
      if (!self.isPaused) {
        callback();
      }
    }, APP_CONSTANTS.SPEECH_WAIT_TIMEOUT_MS);
  };

  // 切換語音播放
  FlashcardApp.prototype.toggleVoice = function() {
    this.voiceSettings.enabled = !this.voiceSettings.enabled;
    this.saveSettings();
    this.updateVoiceButtonState();

    if (!this.voiceSettings.enabled) {
      this.cancelAllSpeech();
    }
  };
  
  // 更新語音按鈕狀態
  FlashcardApp.prototype.updateVoiceButtonState = function() {
    var voiceBtn = document.getElementById('voice-toggle-btn');
    if (voiceBtn) {
      if (this.voiceSettings.enabled) {
        voiceBtn.textContent = '🔊';
        voiceBtn.title = '語音播放：開啟（點擊關閉）';
        voiceBtn.style.opacity = '1';
      } else {
        voiceBtn.textContent = '🔇';
        voiceBtn.title = '語音播放：關閉（點擊開啟）';
        voiceBtn.style.opacity = '0.6';
      }
    }
    this.updateMutedIndicator();
  };
  
  // 更新靜音指示器的顯示狀態
  FlashcardApp.prototype.updateMutedIndicator = function() {
    var mutedIndicator = document.getElementById('muted-indicator');
    if (mutedIndicator) {
      if (!this.voiceSettings.enabled) {
        mutedIndicator.style.display = 'flex';
      } else {
        mutedIndicator.style.display = 'none';
      }
    }
  };

  FlashcardApp.prototype.openVoiceSettings = function() {
    var modal = openModalById(this, 'voice-settings-modal');
    if (modal) {
      
      var speechEnabledSetting = document.getElementById('speech-enabled-setting');
      var voiceRateSetting = document.getElementById('voice-rate-setting');
      var voiceRateValue = document.getElementById('voice-rate-value');
      var spellOutLettersSetting = document.getElementById('spell-out-letters-setting');
      var chineseSpeechEnabledSetting = document.getElementById('chinese-speech-enabled-setting');
      
      if (speechEnabledSetting) speechEnabledSetting.checked = this.voiceSettings.enabled;
      if (voiceRateSetting) voiceRateSetting.value = this.voiceSettings.rate;
      if (voiceRateValue) {
        // 修復浮點數精度問題
        var step = parseFloat(voiceRateSetting.step) || 0.1;
        var decimalPlaces = step.toString().indexOf('.') !== -1 ? step.toString().split('.')[1].length : 0;
        var formattedRate = parseFloat(this.voiceSettings.rate.toFixed(decimalPlaces));
        voiceRateValue.textContent = formattedRate;
      }
      if (spellOutLettersSetting) spellOutLettersSetting.checked = this.voiceSettings.spellOutLetters || false;
      var spellOutScopeSetting = document.getElementById('spell-out-scope-setting');
      if (spellOutScopeSetting) spellOutScopeSetting.value = this.voiceSettings.spellOutScope || 'all';
      this.updateSpellOutScopeVisibility();
      if (chineseSpeechEnabledSetting) chineseSpeechEnabledSetting.checked = this.voiceSettings.chineseEnabled || false;
      
      var delaySpeechToggle = document.getElementById('delay-speech-setting');
      if (delaySpeechToggle) delaySpeechToggle.checked = this.settings.delaySpeechInNormalMode;
      
      var listeningModeToggle = document.getElementById('listening-mode-setting');
      if (listeningModeToggle) listeningModeToggle.checked = this.settings.listeningMode;
      
      this.populateVoiceSelect();
    }
  };
  
  FlashcardApp.prototype.closeVoiceSettings = function() {
    closeModalById(this, 'voice-settings-modal');
  };

  // 依「唸出每一個英文字母」開關，顯示/隱藏「逐字拼讀的範圍」選項
  FlashcardApp.prototype.updateSpellOutScopeVisibility = function() {
    var spellOutLettersSetting = document.getElementById('spell-out-letters-setting');
    var spellOutScopeGroup = document.getElementById('spell-out-scope-group');
    if (spellOutScopeGroup) {
      var enabled = spellOutLettersSetting ? spellOutLettersSetting.checked : false;
      spellOutScopeGroup.style.display = enabled ? '' : 'none';
    }
  };
  
  // 預覽語音 - 播放示例文字
  FlashcardApp.prototype.previewVoice = function(voiceURI, sampleText) {
    try {
      // 檢查語音合成API是否可用
      if (!this.speechSynthesis) {
        console.warn('語音合成API不可用');
        return;
      }
      
      // 清理中文語音等待定時器
      if (this.chineseWaitInterval) {
        clearInterval(this.chineseWaitInterval);
        this.chineseWaitInterval = null;
      }
      
      // 停止當前正在播放的語音
      this.speechSynthesis.cancel();
      
      // 獲取當前設定的語音速度
      var voiceRateSetting = document.getElementById('voice-rate-setting');
      var rate = voiceRateSetting ? parseFloat(voiceRateSetting.value) : this.voiceSettings.rate;
      
      console.log('預覽語音:', voiceURI, '示例文字:', sampleText, '速度:', rate);
      
      // 創建語音utterance
      var utterance = new SpeechSynthesisUtterance(sampleText);
      utterance.rate = rate;
      utterance.pitch = this.voiceSettings.pitch || 1;
      utterance.volume = this.voiceSettings.volume || 1;
      
      // 尋找指定的語音
      var voices = this.speechSynthesis.getVoices();
      var selectedVoice = null;
      
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].voiceURI === voiceURI) {
          selectedVoice = voices[i];
          break;
        }
      }
      
      if (selectedVoice) {
        utterance.voice = selectedVoice;
        utterance.lang = selectedVoice.lang;
        console.log('使用語音:', selectedVoice.name, '語言:', selectedVoice.lang);
      } else {
        console.warn('找不到指定的語音:', voiceURI);
      }
      
      // 播放語音
      this.speechSynthesis.speak(utterance);
      
      // 添加錯誤處理
      utterance.onerror = function(event) {
        console.error('語音播放錯誤:', event.error);
      };
      
    } catch (error) {
      console.error('預覽語音時發生錯誤:', error);
    }
  };
  
  FlashcardApp.prototype.saveVoiceSettingsAndClose = function() {
    var speechEnabledSetting = document.getElementById('speech-enabled-setting');
    var voiceRateSetting = document.getElementById('voice-rate-setting');
    var voiceSelectSetting = document.getElementById('voice-select-setting');
    var japaneseVoiceSelectSetting = document.getElementById('japanese-voice-select-setting');
    var spellOutLettersSetting = document.getElementById('spell-out-letters-setting');
    var chineseSpeechEnabledSetting = document.getElementById('chinese-speech-enabled-setting');
    var chineseVoiceSelectSetting = document.getElementById('chinese-voice-select-setting');
    var delaySpeechToggle = document.getElementById('delay-speech-setting');
    
    if (speechEnabledSetting) this.voiceSettings.enabled = speechEnabledSetting.checked;
    if (voiceRateSetting) this.voiceSettings.rate = parseFloat(voiceRateSetting.value);
    if (spellOutLettersSetting) this.voiceSettings.spellOutLetters = spellOutLettersSetting.checked;
    var spellOutScopeSetting = document.getElementById('spell-out-scope-setting');
    if (spellOutScopeSetting) this.voiceSettings.spellOutScope = spellOutScopeSetting.value;
    if (chineseSpeechEnabledSetting) this.voiceSettings.chineseEnabled = chineseSpeechEnabledSetting.checked;
    if (delaySpeechToggle) this.settings.delaySpeechInNormalMode = delaySpeechToggle.checked;
    
    var listeningModeToggle = document.getElementById('listening-mode-setting');
    if (listeningModeToggle) this.settings.listeningMode = listeningModeToggle.checked;
    
    if (voiceSelectSetting) {
      var selectedVoiceURI = voiceSelectSetting.value;
      this.voiceSettings.voiceURI = selectedVoiceURI;
      var voices = this.speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].voiceURI === selectedVoiceURI) {
          this.voiceSettings.lang = voices[i].lang;
          break;
        }
      }
    }
    
    if (japaneseVoiceSelectSetting) {
      var selectedJapaneseVoiceURI = japaneseVoiceSelectSetting.value;
      this.voiceSettings.japaneseVoiceURI = selectedJapaneseVoiceURI;
      var voices = this.speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].voiceURI === selectedJapaneseVoiceURI) {
          this.voiceSettings.japaneseLang = voices[i].lang;
          break;
        }
      }
    }
    
    if (chineseVoiceSelectSetting) {
      var selectedChineseVoiceURI = chineseVoiceSelectSetting.value;
      this.voiceSettings.chineseVoiceURI = selectedChineseVoiceURI;
      var voices = this.speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].voiceURI === selectedChineseVoiceURI) {
          this.voiceSettings.chineseLang = voices[i].lang;
          break;
        }
      }
    }
    
    this.saveSettings();
    this.updateVoiceButtonState();
    this.closeVoiceSettings();
  };
  
  FlashcardApp.prototype.populateVoiceSelect = function() {
    var voiceSelect = document.getElementById('voice-select-setting');
    var japaneseVoiceSelect = document.getElementById('japanese-voice-select-setting');
    var voices = this.speechSynthesis.getVoices();
    var self = this;
    
    // 填充英文語音選項
    if (voiceSelect) {
      // 保護select元素
      this.protectSelectElement(voiceSelect);
      
      voiceSelect.innerHTML = '';
      var englishVoices = voices.filter(function(v) { 
        return v.lang && v.lang.indexOf('en') === 0; 
      });
      
      for (var i = 0; i < englishVoices.length; i++) {
        var voice = englishVoices[i];
        var option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = voice.name + ' (' + voice.lang + ')';
        if (voice.voiceURI === this.voiceSettings.voiceURI) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      }
      
      if (!voiceSelect.value && englishVoices.length > 0) {
        voiceSelect.value = englishVoices[0].voiceURI;
      }
      
      // 添加change事件監聽器 - 切換時播放示例語音
      voiceSelect.addEventListener('change', function() {
        var selectedVoiceURI = voiceSelect.value;
        self.previewVoice(selectedVoiceURI, 'Hello, this is a sample voice for English pronunciation.');
      });
    }
    
    // 填充日文語音選項
    if (japaneseVoiceSelect) {
      // 保護select元素
      this.protectSelectElement(japaneseVoiceSelect);
      
      japaneseVoiceSelect.innerHTML = '';
      var japaneseVoices = voices.filter(function(v) { 
        return v.lang && v.lang.indexOf('ja') === 0; 
      });
      
      for (var i = 0; i < japaneseVoices.length; i++) {
        var voice = japaneseVoices[i];
        var option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = voice.name + ' (' + voice.lang + ')';
        if (voice.voiceURI === this.voiceSettings.japaneseVoiceURI) {
          option.selected = true;
        }
        japaneseVoiceSelect.appendChild(option);
      }
      
      if (!japaneseVoiceSelect.value && japaneseVoices.length > 0) {
        japaneseVoiceSelect.value = japaneseVoices[0].voiceURI;
      }
      
      // 添加change事件監聽器 - 切換時播放示例語音
      japaneseVoiceSelect.addEventListener('change', function() {
        var selectedVoiceURI = japaneseVoiceSelect.value;
        self.previewVoice(selectedVoiceURI, 'こんにちは、これは日本語の音声サンプルです。');
      });
    }
    
    // 填充中文語音選項
    var chineseVoiceSelect = document.getElementById('chinese-voice-select-setting');
    if (chineseVoiceSelect) {
      // 保護select元素
      this.protectSelectElement(chineseVoiceSelect);
      
      chineseVoiceSelect.innerHTML = '';
      var chineseVoices = voices.filter(function(v) { 
        return v.lang && (v.lang.indexOf('zh') === 0 || v.lang.indexOf('cmn') === 0 || v.lang.indexOf('yue') === 0); 
      });
      
      for (var i = 0; i < chineseVoices.length; i++) {
        var voice = chineseVoices[i];
        var option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = voice.name + ' (' + voice.lang + ')';
        if (voice.voiceURI === this.voiceSettings.chineseVoiceURI) {
          option.selected = true;
        }
        chineseVoiceSelect.appendChild(option);
      }
      
      if (!chineseVoiceSelect.value && chineseVoices.length > 0) {
        chineseVoiceSelect.value = chineseVoices[0].voiceURI;
      }
      
      // 添加change事件監聽器 - 切換時播放示例語音
      chineseVoiceSelect.addEventListener('change', function() {
        var selectedVoiceURI = chineseVoiceSelect.value;
        self.previewVoice(selectedVoiceURI, '你好，這是中文語音範例。');
      });
    }
  };
</script>
