<script>
  /**
   * @module script-settings-modal
   * @description 設定模態框模組：一般設定開啟/關閉/儲存/重置、快速模式切換、
   *   Sheet 設定 UI 開啟/關閉、滑桿交互增強。
   *
   * @dependencies script-core.html (FlashcardApp, APP_CONSTANTS, openModalById, closeModalById)
   * @provides FlashcardApp.prototype: openSettings, closeSettings,
   *   _refreshReviewPoolForRatioChange, saveSettingsAndClose, resetSettings, applyQuickMode,
   *   openSheetSettings, closeSheetSettings, enhanceSliderInteraction
   */

  // 開啟設定
  FlashcardApp.prototype.openSettings = function() {
    var modal = openModalById(this, 'settings-modal');
    if (modal) {
      this.applySettings();
    }
  };
  
  // 關閉設定
  FlashcardApp.prototype.closeSettings = function(shouldRedisplay) {
    closeModalById(this, 'settings-modal');
    if (shouldRedisplay) {
      this.redisplayCurrentWord();
    }
  };
  
  /**
   * 強制複習比例變更後，立即重算目前複習池。
   * 一般單字維持目前複習清單與順序，只重新挑選額外的強制複習字並隨機穿插；
   * 快速複習仍保留原本選擇的 N 個一般單字，不會退回一般輪播模式。
   */
  FlashcardApp.prototype._refreshReviewPoolForRatioChange = function() {
    if (!this.words || this.words.length === 0) return;

    // 正常情況下 currentWords 已包含目前篩選結果；空清單時重新套用一次篩選。
    if (!this.currentWords || this.currentWords.length === 0) {
      this.currentWords = this.applyAllFilters(this.words);
    }

    var currentWord = this.currentWords[this.currentIndex];
    var currentWordId = (currentWord && currentWord.id !== undefined && currentWord.id !== null)
      ? currentWord.id
      : null;

    // 保留目前仍要複習的一般單字；它們已套用過篩選，且不應因改比例而被重選。
    var normalWords = [];
    for (var i = 0; i < this.currentWords.length; i++) {
      if (!isForcedReviewWord(this.currentWords[i])) {
        normalWords.push(this.currentWords[i]);
      }
    }

    // 強制複習字可略過一般篩選，但本回合已移除的字不可再加入。
    var removedIds = {};
    if (this.removedWords && this.removedWords.length > 0) {
      for (var r = 0; r < this.removedWords.length; r++) {
        removedIds[this.removedWords[r].id] = true;
      }
    }

    var forcedReviewCandidates = [];
    for (var w = 0; w < this.words.length; w++) {
      var word = this.words[w];
      if (isForcedReviewWord(word) && !removedIds[word.id]) {
        forcedReviewCandidates.push(word);
      }
    }

    var selectedForcedReviewWords = this.selectForcedReviewWords(
      forcedReviewCandidates,
      normalWords.length
    );
    var updatedWords = this.interleaveForcedReviewWords(normalWords, selectedForcedReviewWords);

    // 清掉舊清單的復原／待移除狀態，避免索引與新清單不一致。
    this._clearRemovalUndoHalfExpireTimer();
    this.removalUndoEntry = null;
    this.pendingRemoval = null;
    this.navigationHistory = [];
    this.hideRestoreButton();

    this.currentWords = updatedWords;
    this.currentIndex = 0;

    // 盡量留在原本正在看的單字；只有該字因比例改變被排除時才回到第一張。
    if (currentWordId !== null) {
      for (var c = 0; c < this.currentWords.length; c++) {
        if (this.currentWords[c].id === currentWordId) {
          this.currentIndex = c;
          break;
        }
      }
    }

    // 若比例設為 0% 且原本只有強制複習字，會得到空複習池；
    // 不進入 displayCurrentWord（空池會觸發新回合重載），只更新空狀態提示。
    if (this.currentWords.length === 0) {
      this.currentIndex = -1;
      this.updateProgress();
      this.updateActiveFilterDisplay();
      if (typeof this.showNotification === 'function') {
        this.showNotification('目前沒有可複習的單字', 'info');
      }
      return;
    }

    // displayCurrentWord 會重新啟動倒數；明確再更新一次進度，確保分母
    //（實際複習總數）立即反映新的強制複習比例。
    this.displayCurrentWord();
    this.updateProgress();
    this.updateActiveFilterDisplay();

    if (typeof this.showNotification === 'function') {
      this.showNotification('強制複習比例已更新，共 ' + this.currentWords.length + ' 個單字', 'success');
    }
  };

  // 儲存設定並關閉
  FlashcardApp.prototype.saveSettingsAndClose = function() {
    var delaySlider = document.getElementById('delay-setting');
    var fontSizeSlider = document.getElementById('font-size-setting');
    var fontFamilySelect = document.getElementById('font-family-setting');
    
    var oldDisplayMode = this.settings.displayMode;
    var oldFontFamily = this.settings.fontFamily;
    var oldGrammarAnnotationEnabled = this.settings.grammarAnnotationEnabled !== false;
    var oldForcedReviewRatio = this.getForcedReviewRatio();
    
    if (delaySlider) this.settings.delayTime = parseFloat(delaySlider.value);
    if (fontSizeSlider) this.settings.fontSize = parseInt(fontSizeSlider.value);
    if (fontFamilySelect) this.settings.fontFamily = fontFamilySelect.value;
    
    // 讀取顯示模式 radio buttons
    var selectedMode = document.querySelector('input[name="display-mode"]:checked');
    if (selectedMode) this.settings.displayMode = selectedMode.value;
    
    // 讀取要會拼強制先中文開關
    var mustSpellChineseFirstToggle = document.getElementById('must-spell-chinese-first-setting');
    if (mustSpellChineseFirstToggle) this.settings.mustSpellChineseFirst = mustSpellChineseFirstToggle.checked;
    
    // 讀取智慧計時開關
    var smartTimerToggle = document.getElementById('smart-timer-setting');
    if (smartTimerToggle) this.settings.smartTimerEnabled = smartTimerToggle.checked;
    
    // 讀取計時進度條開關
    var showTimerToggle = document.getElementById('show-timer-progress-setting');
    if (showTimerToggle) this.settings.showTimerProgressBar = showTimerToggle.checked;
    
    // 讀取計時進度條偏移量
    var timerOffsetInput = document.getElementById('timer-offset-setting');
    if (timerOffsetInput) this.settings.timerProgressBarOffset = parseInt(timerOffsetInput.value, 10) || 0;
    
    // 讀取 KK 音標顯示開關
    var kkPhoneticToggle = document.getElementById('kk-phonetic-setting');
    if (kkPhoneticToggle) this.settings.showKKPhonetic = kkPhoneticToggle.checked;

    // 讀取英文語法角色自動標注開關
    var grammarAnnotationToggle = document.getElementById('grammar-annotation-setting');
    if (grammarAnnotationToggle) {
      this.settings.grammarAnnotationEnabled = grammarAnnotationToggle.checked;
    }

    // 讀取強制複習比例（一般複習數量的百分比）
    var forcedReviewRatioInput = document.getElementById('forced-review-ratio-setting');
    if (forcedReviewRatioInput) {
      var forcedReviewRatio = parseFloat(forcedReviewRatioInput.value);
      if (!isFinite(forcedReviewRatio)) {
        forcedReviewRatio = APP_CONSTANTS.FORCED_REVIEW_RATIO_DEFAULT;
      }
      this.settings.forcedReviewRatio = Math.max(
        APP_CONSTANTS.FORCED_REVIEW_RATIO_MIN,
        Math.min(APP_CONSTANTS.FORCED_REVIEW_RATIO_MAX, forcedReviewRatio)
      );
    }
    
    var forcedReviewRatioChanged = this.getForcedReviewRatio() !== oldForcedReviewRatio;

    this.saveSettings();
    this.applySettings();
    this.closeSettings();

    // 強制複習比例會影響實際複習池，儲存後立即重算，不需重新整理瀏覽器。
    if (forcedReviewRatioChanged) {
      this._refreshReviewPoolForRatioChange();
    } else if (oldDisplayMode !== this.settings.displayMode ||
               oldFontFamily !== this.settings.fontFamily ||
               oldGrammarAnnotationEnabled !== (this.settings.grammarAnnotationEnabled !== false)) {
      // 如果顯示模式或字型改變，重新顯示當前單字
      this.redisplayCurrentWord();
    }
  };
  
  // 重置設定（目前無 UI 入口，僅測試使用；預設值必須與 script-core.html
  // 的 _initSettingsState 工廠預設一致，否則測試假設會漂移）
  FlashcardApp.prototype.resetSettings = function() {
    this.settings = {
      delayTime: 4.5,
      fontSize: 96,
      displayMode: 'english-first',
      fontFamily: 'system-default',
      delaySpeechInNormalMode: false,
      mustSpellChineseFirst: true,
      showTimerProgressBar: true,
      timerProgressBarOffset: 0,
      smartTimerEnabled: false,
      listeningMode: false,
      carouselMemoryMode: false,
      showKKPhonetic: true,            // KK 音標顯示開關（預設開啟）
      grammarAnnotationEnabled: true,  // 英文語法角色自動標注（預設開啟）
      forcedReviewRatio: APP_CONSTANTS.FORCED_REVIEW_RATIO_DEFAULT // 強制複習字比例（%，預設 10%）
    };
    this.voiceSettings = {
      enabled: true,
      rate: 0.8,
      pitch: 1,
      volume: 1,
      lang: 'en-US',
      voiceURI: '',
      japaneseLang: 'ja-JP',
      japaneseVoiceURI: '',
      spellOutLetters: false,
      spellOutScope: 'all',
      chineseEnabled: false,
      chineseLang: 'zh-TW',
      chineseVoiceURI: ''
    };
    this.applySettings();
      this.saveSettings();
    this.closeSettings();
  };
  
  // 快速模式切換
  FlashcardApp.prototype.applyQuickMode = function(mode) {
    var details = [];

    var wasListeningMode = this.settings.listeningMode;

    if (mode === 1) {
      this.settings.displayMode = 'chinese-first';
      this.voiceSettings.spellOutLetters = true;
      this.voiceSettings.spellOutScope = 'all';
      this.voiceSettings.chineseEnabled = true;
      this.settings.delayTime = 9;
      this.settings.smartTimerEnabled = true;
      this.settings.showTimerProgressBar = true;
      this.settings.listeningMode = false;
      details = [
        '🎧 用聽的背單字',
        '🔄 顯示模式：先中文',
        '🔤 字母拼讀：開（所有單字）',
        '🗣️ 中文發音：開',
        '⏱️ 延遲秒數：9 秒',
        '⏱️ 智慧計時：開',
        '⏱️ 計時進度條：開'
      ];
    } else if (mode === 2) {
      this.settings.displayMode = 'english-first';
      this.voiceSettings.spellOutLetters = false;
      this.voiceSettings.chineseEnabled = true;
      this.settings.delayTime = 4.5;
      this.settings.smartTimerEnabled = true;
      this.settings.showTimerProgressBar = true;
      this.settings.delaySpeechInNormalMode = false;
      this.settings.listeningMode = false;
      details = [
        '👂 用聽的認識單字',
        '🔄 顯示模式：先英文',
        '🔤 字母拼讀：關',
        '🗣️ 中文發音：開',
        '⏱️ 延遲秒數：4.5 秒',
        '⏱️ 智慧計時：開',
        '⏱️ 計時進度條：開',
        '⏳ 延遲發音：關'
      ];
    } else if (mode === 3) {
      this.settings.displayMode = 'mixed';
      this.settings.delaySpeechInNormalMode = true;
      this.voiceSettings.spellOutLetters = true;
      this.voiceSettings.spellOutScope = 'must-spell-all';
      this.voiceSettings.chineseEnabled = false;
      this.settings.delayTime = 10;
      this.settings.smartTimerEnabled = true;
      this.settings.showTimerProgressBar = true;
      this.settings.listeningMode = false;
      details = [
        '📝 日常複習',
        '🔄 顯示模式：隨機混合',
        '🔤 字母拼讀：開（所有要會拼單字）',
        '🗣️ 中文發音：關',
        '⏱️ 延遲秒數：10 秒',
        '⏱️ 智慧計時：開',
        '⏱️ 計時進度條：開',
        '⏳ 延遲發音：開'
      ];
    } else if (mode === 4) {
      this.settings.listeningMode = true;
      this.settings.displayMode = 'english-first';
      this.settings.carouselMemoryMode = false;
      this.voiceSettings.spellOutLetters = false;
      this.voiceSettings.chineseEnabled = false;
      this.settings.delayTime = 4.5;
      this.settings.smartTimerEnabled = true;
      this.settings.showTimerProgressBar = true;
      details = [
        '🎧 聽力訓練',
        '🎧 聽力模式：開',
        '🔄 顯示模式：先英文',
        '🔤 字母拼讀：關',
        '🗣️ 中文發音：關',
        '⏱️ 延遲秒數：4.5 秒',
        '⏱️ 智慧計時：開',
        '⏱️ 計時進度條：開'
      ];
    } else if (mode === 5) {
      this.settings.carouselMemoryMode = true;
      this.settings.listeningMode = false;
      this.settings.displayMode = 'english-first';
      this.voiceSettings.spellOutLetters = false;
      this.voiceSettings.chineseEnabled = false;
      this.settings.delayTime = 4.5;
      this.settings.smartTimerEnabled = false;
      this.settings.showTimerProgressBar = false;
      this.settings.delaySpeechInNormalMode = false;
      details = [
        '🔄 輪播記憶模式',
        '📖 中英文同時顯示',
        '⏱️ 延遲秒數：4.5 秒',
        '⏱️ 智慧計時：關',
        '⏱️ 計時進度條：關'
      ];
    }

    // 非輪播模式時自動關閉輪播旗標
    if (mode !== 5 && this.settings.carouselMemoryMode) {
      this.settings.carouselMemoryMode = false;
    }

    if (wasListeningMode && !this.settings.listeningMode) {
      details.push('🔇 聽力模式已自動關閉');
    }

    // 解除暫停狀態，確保快速設定套用後能正常運行
    this.userPaused = false;
    this.isPaused = false;
    this._pauseRemainingMs = 0;

    this.saveSettings();
    this.applySettings();
    this.closeMenu();
    this.showNotification(details.join('\n'), 'success');
    this.redisplayCurrentWord();
    this.updatePauseButtonState();
  };

  // 開啟Google Sheet設定
  FlashcardApp.prototype.openSheetSettings = function() {
    console.log('開啟 Google Sheet 設定畫面');
    var modal = openModalById(this, 'sheet-settings-modal');
    if (modal) {
      
      // 還原所有區塊的可見性（上次選擇預設檔後可能被隱藏）
      var showIds = ['default-sheets-group', 'recent-sheets-group', 'sheet-id-group', 'load-sheets-group'];
      for (var i = 0; i < showIds.length; i++) {
        var el = document.getElementById(showIds[i]);
        if (el) el.style.display = '';
      }
      
      var sheetIdInput = document.getElementById('sheet-id-input');
      if (sheetIdInput) {
        sheetIdInput.value = this.sheetSettings.sheetId || '';
      }
      
      var sheetsGroup = document.getElementById('sheets-selection-group');
      if (sheetsGroup) {
        sheetsGroup.style.display = 'none';
      }
      
      var saveBtn = document.getElementById('save-sheet-settings');
      if (saveBtn) {
        saveBtn.disabled = true;
      }
      
      // 顯示歷史記錄
      this.displaySheetHistory();
    }
  };
  
  // 關閉Google Sheet設定
  FlashcardApp.prototype.closeSheetSettings = function() {
    closeModalById(this, 'sheet-settings-modal');
  };

  // 增強滑桿交互體驗（點擊/觸摸任意位置即可跳到對應值）
  FlashcardApp.prototype.enhanceSliderInteraction = function(slider, valueElementId, unit) {
    if (!slider) return;
    
    var self = this;
    unit = unit || '';
    
    function calculateValueFromClick(event, sliderElement) {
      var rect = sliderElement.getBoundingClientRect();
      var clickX = event.clientX || (event.touches && event.touches[0] ? event.touches[0].clientX : 0);
      var sliderX = clickX - rect.left;
      var sliderWidth = rect.width;
      
      if (sliderX < 0) sliderX = 0;
      if (sliderX > sliderWidth) sliderX = sliderWidth;
      
      var percentage = sliderX / sliderWidth;
      
      var min = parseFloat(sliderElement.min);
      var max = parseFloat(sliderElement.max);
      var step = parseFloat(sliderElement.step) || 1;
      
      var rawValue = min + (max - min) * percentage;
      var steppedValue = Math.round(rawValue / step) * step;
      
      if (steppedValue < min) steppedValue = min;
      if (steppedValue > max) steppedValue = max;
      
      var decimalPlaces = 0;
      if (step.toString().indexOf('.') !== -1) {
        decimalPlaces = step.toString().split('.')[1].length;
      }
      steppedValue = parseFloat(steppedValue.toFixed(decimalPlaces));
      
      return steppedValue;
    }
    
    function updateSliderValue(newValue) {
      slider.value = newValue;
      
      var inputEvent;
      try {
        inputEvent = new Event('input', { bubbles: true });
      } catch (e) {
        inputEvent = document.createEvent('HTMLEvents');
        inputEvent.initEvent('input', true, true);
      }
      slider.dispatchEvent(inputEvent);
      
      var valueElement = document.getElementById(valueElementId);
      if (valueElement) {
        var step = parseFloat(slider.step) || 1;
        var decimalPlaces = 0;
        if (step.toString().indexOf('.') !== -1) {
          decimalPlaces = step.toString().split('.')[1].length;
        }
        var formattedValue = parseFloat(newValue.toFixed(decimalPlaces));
        valueElement.textContent = formattedValue + unit;
      }
    }
    
    function handleClick(event) {
      event.preventDefault();
      event.stopPropagation();
      
      var newValue = calculateValueFromClick(event, slider);
      updateSliderValue(newValue);
    }
    
    function handleTouchStart(event) {
      event.preventDefault();
      var newValue = calculateValueFromClick(event, slider);
      updateSliderValue(newValue);
    }
    
    slider.addEventListener('click', handleClick);
    slider.addEventListener('touchstart', handleTouchStart);
    
    console.log('已增強滑塊交互體驗:', slider.id);
  };

</script>
