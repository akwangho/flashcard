<script>
  /**
   * @module script-grammar
   * @description 英文句子語法角色自動標注（完整支援一張卡片內的多句內容）：
   *   辨識主要動詞、助動詞與 BE 動詞，
   *   以三種顏色標示；單字與片語不標注，先顯示的英文保留原文，
   *   等中文出現時才補上標注。
   *
   * @dependencies vendor-compromise.html (window.nlp), script-core.html
   * @provides FlashcardApp.prototype: getGrammarAnnotations,
   *   renderGrammarAnnotations, setGrammarAnnotatedText,
   *   updateGrammarLegendVisibility
   */

  var GRAMMAR_ROLE_VERB = 'verb';
  var GRAMMAR_ROLE_AUXILIARY = 'auxiliary';
  var GRAMMAR_ROLE_BE = 'be';

  /** 常見原形動詞：供 modal / do-support 文法的後備判斷使用。 */
  var GRAMMAR_COMMON_VERBS = {
    'be': true, 'become': true, 'begin': true, 'believe': true, 'break': true,
    'bring': true, 'build': true, 'buy': true, 'call': true, 'come': true,
    'connect': true, 'cry': true, 'cut': true, 'do': true, 'drink': true, 'drive': true,
    'eat': true, 'fall': true, 'feel': true, 'find': true, 'finish': true,
    'fly': true, 'forget': true, 'get': true, 'give': true, 'go': true,
    'grow': true, 'have': true, 'hear': true, 'help': true, 'hold': true,
    'hope': true, 'hurry': true, 'jump': true, 'keep': true, 'know': true,
    'laugh': true, 'learn': true, 'leave': true, 'let': true, 'like': true,
    'listen': true, 'live': true, 'look': true, 'love': true, 'make': true,
    'meet': true, 'move': true, 'need': true, 'open': true, 'play': true,
    'please': true, 'put': true, 'read': true, 'ride': true, 'run': true,
    'say': true, 'see': true, 'sell': true, 'send': true, 'sing': true,
    'sit': true, 'sleep': true, 'speak': true, 'spend': true, 'stand': true,
    'start': true, 'stay': true, 'study': true, 'swim': true, 'take': true,
    'talk': true, 'teach': true, 'tell': true, 'think': true, 'throw': true,
    'travel': true, 'try': true, 'understand': true, 'use': true,
    'visit': true, 'wait': true, 'walk': true, 'want': true, 'watch': true,
    'wear': true, 'win': true, 'wish': true, 'work': true, 'write': true,
    'mark': true, 'circle': true, 'slice': true, 'welcome': true
  };

  var GRAMMAR_BE_WORDS = {
    'am': true, 'is': true, 'are': true, 'was': true, 'were': true,
    'be': true, 'been': true, 'being': true
  };

  var GRAMMAR_MODAL_WORDS = {
    'can': true, 'could': true, 'may': true, 'might': true, 'must': true,
    'shall': true, 'should': true, 'will': true, 'would': true,
    'ought': true, 'cannot': true
  };

  /**
   * 連繫動詞（linking verb）：後面接的是主語補語（形容詞／名詞），
   * 例如 `I feel glad.`、`She seems happy.`、`He became a teacher.`。
   */
  var GRAMMAR_LINKING_VERBS = {
    'become': true, 'became': true, 'becoming': true,
    'seem': true, 'seemed': true, 'seeming': true,
    'appear': true, 'appeared': true, 'appearing': true,
    'feel': true, 'felt': true, 'feeling': true,
    'look': true, 'looked': true, 'looking': true,
    'sound': true, 'sounded': true, 'sounding': true,
    'taste': true, 'tasted': true, 'tasting': true,
    'smell': true, 'smelled': true, 'smelling': true,
    'remain': true, 'remained': true, 'remaining': true,
    'stay': true, 'stayed': true, 'staying': true,
    'grow': true, 'grew': true, 'grown': true, 'growing': true,
    'turn': true, 'turned': true, 'turning': true,
    'get': true, 'got': true, 'gotten': true, 'getting': true,
    'keep': true, 'kept': true, 'keeping': true,
    'prove': true, 'proved': true, 'proven': true, 'proving': true
  };

  /**
   * 常見主語補語形容詞。放在 BE／連繫動詞後時是形容詞而非動詞；
   * 特別涵蓋 compromise 容易誤判的 `glad / happy / ready / willing`。
   */
  var GRAMMAR_PREDICATE_ADJECTIVES = {
    'able': true, 'afraid': true, 'alive': true, 'alone': true,
    'angry': true, 'anxious': true, 'ashamed': true, 'available': true,
    'aware': true, 'beautiful': true, 'better': true, 'bored': true,
    'busy': true, 'calm': true, 'careless': true, 'cheerful': true,
    'clean': true, 'clear': true, 'clever': true, 'comfortable': true,
    'confident': true, 'confused': true, 'content': true, 'crazy': true,
    'curious': true, 'dead': true, 'delighted': true,
    'disappointed': true, 'eager': true, 'early': true, 'easy': true,
    'excited': true, 'expensive': true, 'fair': true, 'faithful': true,
    'famous': true, 'finished': true, 'free': true, 'fresh': true,
    'friendly': true, 'frightened': true, 'glad': true, 'good': true,
    'grateful': true, 'happy': true, 'healthy': true, 'helpful': true,
    'honest': true, 'hungry': true, 'ill': true, 'interested': true,
    'jealous': true, 'kind': true, 'late': true, 'lucky': true,
    'nervous': true, 'nice': true, 'okay': true, 'open': true,
    'patient': true, 'perfect': true, 'pleased': true, 'polite': true,
    'poor': true, 'proud': true, 'ready': true, 'real': true,
    'right': true, 'sad': true, 'safe': true, 'scared': true,
    'serious': true, 'shy': true, 'sorry': true, 'strong': true,
    'stupid': true, 'surprised': true, 'sure': true, 'sweet': true,
    'tired': true, 'upset': true, 'useful': true, 'weak': true,
    'well': true, 'willing': true, 'worried': true, 'wrong': true,
    'flushed': true, 'stuck': true
  };

  /** 常見副詞：句首誤判成動詞時，依後方主語判斷。 */
  var GRAMMAR_COMMON_ADVERBS = {
    'soon': true, 'already': true, 'still': true, 'then': true,
    'now': true, 'today': true, 'tomorrow': true, 'yesterday': true,
    'however': true, 'therefore': true, 'maybe': true, 'perhaps': true,
    'again': true, 'ever': true, 'never': true, 'always': true,
    'often': true, 'sometimes': true, 'usually': true
  };

  /**
   * 容易在名詞位置被標成動詞的常見字；只有符合名詞上下文時才清除標注。
   */
  var GRAMMAR_NOUN_CONTEXT_WORDS = {
    'bikes': true, 'blocks': true, 'books': true, 'christmas': true,
    'drinks': true, 'hunt': true, 'known': true, 'market': true, 'net': true,
    'plans': true, 'shot': true, 'show': true, 'vegetables': true,
    'view': true
  };

  /**
   * 判斷 compromise term 是否帶有指定標籤。
   * @param {Object} term - compromise term
   * @param {string} tag - 標籤名稱
   * @returns {boolean}
   */
  FlashcardApp.prototype._grammarTermHasTag = function(term, tag) {
    if (!term || !term.tags || !term.tags.length) return false;
    for (var i = 0; i < term.tags.length; i++) {
      if (term.tags[i] === tag) return true;
    }
    return false;
  };

  /**
   * 取得 term 的小寫文字（保留英文撇號，移除首尾非英文字元）。
   * @param {Object} term - compromise term
   * @returns {string}
   */
  FlashcardApp.prototype._grammarTermText = function(term) {
    if (!term) return '';
    var text = (term.text || term.implicit || '').toLowerCase();
    return text.replace(/^[^a-z]+/, '').replace(/[^a-z]+$/, '');
  };

  /**
   * 判斷 term 屬於哪一種語法角色。
   * BE 優先於 auxiliary；一般動詞最後判定。
   * @param {Object} term - compromise term
   * @returns {string|null} 'verb' | 'auxiliary' | 'be' | null
   */
  FlashcardApp.prototype._grammarRoleForTerm = function(term) {
    if (!term) return null;
    var word = this._grammarTermText(term);

    // `to` 是不定詞／介詞標記，不是句中動詞；短語动词的 particle
    // （look forward、give up 的 forward/up）也不是主要動詞。
    if (word === 'to' || word === 'it') return null;
    if (this._grammarTermHasTag(term, 'Particle')) return null;

    // BE 動詞及其縮寫形式優先判定。
    if (GRAMMAR_BE_WORDS[word]) return GRAMMAR_ROLE_BE;
    if (word === "i'm" || word === "you're" || word === "we're" ||
        word === "they're" || word === "he's" || word === "she's" ||
        word === "it's" || word === "that's" || word === "there's" ||
        word === "here's" || word === "who's" || word === "what's" ||
        word === "where's" || word === "when's" || word === "why's" ||
        word === "how's") {
      return GRAMMAR_ROLE_BE;
    }

    // Modal / have / do 等助動詞與其縮寫。
    if (GRAMMAR_MODAL_WORDS[word]) return GRAMMAR_ROLE_AUXILIARY;
    if (word === "i've" || word === "you've" || word === "we've" ||
        word === "they've" || word === "i'd" || word === "you'd" ||
        word === "we'd" || word === "they'd" || word === "he'd" ||
        word === "she'd" || word === "it'd" || word === "i'll" ||
        word === "you'll" || word === "we'll" || word === "they'll" ||
        word === "he'll" || word === "she'll" || word === "it'll" ||
        word === "let's" || word === "don't" || word === "doesn't" || word === "didn't" ||
        word === "can't" || word === "couldn't" || word === "mayn't" ||
        word === "mightn't" || word === "mustn't" || word === "shan't" ||
        word === "shouldn't" || word === "won't" || word === "wouldn't") {
      return GRAMMAR_ROLE_AUXILIARY;
    }

    // 人稱代名詞本身不是動詞；先完成縮寫判斷，避免影響 I'm / I've 等形式。
    if (this._grammarTermHasTag(term, 'Pronoun')) return null;

    if (this._grammarTermHasTag(term, 'Copula')) return GRAMMAR_ROLE_BE;
    if (this._grammarTermHasTag(term, 'Auxiliary') ||
        this._grammarTermHasTag(term, 'Modal')) {
      return GRAMMAR_ROLE_AUXILIARY;
    }
    if (this._grammarTermHasTag(term, 'Verb')) return GRAMMAR_ROLE_VERB;
    return null;
  };

  /**
   * 判斷單字是否為常見原形動詞。
   * @param {string} word - 小寫英文單字
   * @returns {boolean}
   */
  FlashcardApp.prototype._grammarIsCommonVerb = function(word) {
    return !!(word && GRAMMAR_COMMON_VERBS[word]);
  };

  /**
   * 找出下一個實際內容詞，略過修飾用的副詞與否定詞。
   * @param {Array<Object>} units - 可見詞彙單元
   * @param {number} startIndex - 起始索引
   * @returns {number} 下一個內容詞索引；不存在時回傳 -1
   */
  FlashcardApp.prototype._grammarNextContentIndex = function(units, startIndex) {
    for (var i = startIndex; i < units.length; i++) {
      var term = units[i].term;
      if (this._grammarTermHasTag(term, 'Adverb') ||
          this._grammarTermHasTag(term, 'Negative')) {
        continue;
      }
      return i;
    }
    return -1;
  };

  /**
   * 依句法上下文修正主語補語，避免把形容詞誤標成動詞。
   *
   * compromise 偶爾會把 `I am glad to see you.` 的 glad 判成動詞；
   * `willing` 也可能被當成 gerund。BE 動詞與連繫動詞後的補語需依上下文判斷：
   * - 一般動詞／形容詞（如 glad、happy、ready）視為形容詞。
   * - 明確的進行式（running）與被動式（eaten、called）仍視為動詞。
   * - 已知的主語補語形容詞（如 willing、interested）一律不標成動詞。
   *
   * @param {Array<Object>} units - 可見詞彙單元
   */
  FlashcardApp.prototype._grammarApplyContextualAdjectives = function(units) {
    for (var i = 0; i < units.length; i++) {
      var linkWord = this._grammarTermText(units[i].term);
      var isBe = units[i].role === GRAMMAR_ROLE_BE;
      var isLinkingVerb = units[i].role === GRAMMAR_ROLE_VERB &&
                          GRAMMAR_LINKING_VERBS[linkWord];
      if (!isBe && !isLinkingVerb) continue;

      var targetIndex = this._grammarNextContentIndex(units, i + 1);
      if (targetIndex < 0 || units[targetIndex].role !== GRAMMAR_ROLE_VERB) continue;

      var target = units[targetIndex];
      var targetWord = this._grammarTermText(target.term);
      var isGerund = this._grammarTermHasTag(target.term, 'Gerund');
      var isParticiple = this._grammarTermHasTag(target.term, 'Participle');
      var isPastTense = this._grammarTermHasTag(target.term, 'PastTense');

      // 已知的主語補語形容詞優先；即使 compromise 標成 Gerund/Participle 也不標紅。
      if (GRAMMAR_PREDICATE_ADJECTIVES[targetWord]) {
        target.role = null;
        continue;
      }

      if (isBe) {
        // BE + 一般動詞在正常英文中是形容詞補語；
        // Gerund（am running）、Participle（is eaten）與
        // PastTense 被動式（was called Tom）則保留動詞角色。
        if (!isGerund && !isParticiple && !isPastTense) target.role = null;
      } else if (isLinkingVerb) {
        // 連繫動詞 + 形容詞 + to infinitive，例如 `feel glad to see you.`。
        var nextIndex = this._grammarNextContentIndex(units, targetIndex + 1);
        var nextWord = nextIndex >= 0 ? this._grammarTermText(units[nextIndex].term) : '';
        if (nextWord === 'to' && !isGerund && !isParticiple) target.role = null;
      }
    }
  };

  /**
   * 修正片語助動詞：`used to ...`、`about to ...`。
   * @param {Array<Object>} units - 可見詞彙單元
   */
  FlashcardApp.prototype._grammarApplyPhraseAuxiliaries = function(units) {
    for (var i = 0; i < units.length - 1; i++) {
      var word = this._grammarTermText(units[i].term);
      var nextWord = this._grammarTermText(units[i + 1].term);
      if (nextWord === 'to' &&
          (word === 'used' || word === 'about' || word === 'supposed')) {
        units[i].role = GRAMMAR_ROLE_AUXILIARY;
      }
    }
  };

  /**
   * 找出 do / does / did 問句中的助動詞與主要動詞。
   * 除句首 `Do you...?` 外，也支援 wh-questions 中的嵌入 do-support：
   * `What fruit does your mom like?`、`What do you do...?`。
   * @param {Array<Object>} units - 可見詞彙單元
   * @param {string} text - 單句英文文字
   */
  FlashcardApp.prototype._grammarApplyDoQuestion = function(units, text) {
    if (!units.length || !/[?？]/.test(text)) return;

    var doWords = { 'do': true, 'does': true, 'did': true };
    var candidates = [];
    for (var i = 0; i < units.length; i++) {
      var word = this._grammarTermText(units[i].term);
      if (doWords[word]) candidates.push(i);
    }
    if (!candidates.length) return;

    for (var c = 0; c < candidates.length; c++) {
      var candidateIndex = candidates[c];
      if (units[candidateIndex].role === GRAMMAR_ROLE_AUXILIARY) continue;

      var foundSubject = false;
      var foundDoForm = -1;
      var foundVerb = -1;
      var scanEnd = Math.min(units.length, candidateIndex + 8);

      for (var j = candidateIndex + 1; j < scanEnd; j++) {
        var term = units[j].term;
        var termWord = this._grammarTermText(term);

        // 子句邊界後的動詞不屬於目前 do-support 結構。
        if (this._grammarTermHasTag(term, 'Connector') ||
            this._grammarTermHasTag(term, 'Conjunction') ||
            termWord === 'when' || termWord === 'where' || termWord === 'why') {
          break;
        }
        if (this._grammarTermHasTag(term, 'Adverb') ||
            this._grammarTermHasTag(term, 'Negative') ||
            this._grammarTermHasTag(term, 'Determiner') ||
            this._grammarTermHasTag(term, 'Possessive')) {
          continue;
        }

        if (doWords[termWord]) {
          if (foundSubject && foundDoForm < 0) foundDoForm = j;
          continue;
        }

        if (this._grammarTermHasTag(term, 'Pronoun') ||
            this._grammarTermHasTag(term, 'Person') ||
            this._grammarTermHasTag(term, 'Noun')) {
          foundSubject = true;
          continue;
        }

        if (units[j].role === GRAMMAR_ROLE_VERB ||
            units[j].role === GRAMMAR_ROLE_AUXILIARY ||
            units[j].role === GRAMMAR_ROLE_BE) {
          if (foundSubject || candidateIndex === 0) {
            foundVerb = j;
            break;
          }
        }

        // compromise 可能把 `like` 判成介詞；已知動詞且位於主詞後時仍視為主要動詞。
        if (foundSubject && !units[j].role && this._grammarIsCommonVerb(termWord)) {
          units[j].role = GRAMMAR_ROLE_VERB;
          foundVerb = j;
          break;
        }
      }

      if (foundVerb >= 0) {
        units[candidateIndex].role = GRAMMAR_ROLE_AUXILIARY;
      } else if (foundDoForm >= 0) {
        // `What do you do...?`：第一個 do 是助動詞，第二個 do 是主要動詞。
        units[candidateIndex].role = GRAMMAR_ROLE_AUXILIARY;
        units[foundDoForm].role = GRAMMAR_ROLE_VERB;
      }
    }
  };

  /**
   * 補強 modal 後方的主要動詞（例如 `can swim`）。
   * @param {Array<Object>} units - 可見詞彙單元
   */
  FlashcardApp.prototype._grammarApplyModalFallback = function(units) {
    for (var i = 0; i < units.length; i++) {
      if (units[i].role !== GRAMMAR_ROLE_AUXILIARY) continue;
      var modalWord = this._grammarTermText(units[i].term);
      if (!GRAMMAR_MODAL_WORDS[modalWord]) continue;

      for (var j = i + 1; j < units.length; j++) {
        var nextTerm = units[j].term;
        if (this._grammarTermHasTag(nextTerm, 'Adverb') ||
            this._grammarTermHasTag(nextTerm, 'Negative')) {
          continue;
        }
        if (!units[j].role) {
          var nextWord = this._grammarTermText(nextTerm);
          if (this._grammarIsCommonVerb(nextWord)) {
            units[j].role = GRAMMAR_ROLE_VERB;
          }
        }
        break;
      }
    }
  };

  /**
   * 補強 compromise 誤標為介詞的常見動詞。
   * 例如 `I like to ride...` 的 like 可能是 Preposition，但此處是主要動詞。
   * @param {Array<Object>} units - 可見詞彙單元
   */
  FlashcardApp.prototype._grammarApplyCommonVerbFallback = function(units) {
    for (var i = 1; i < units.length; i++) {
      if (units[i].role) continue;
      var word = this._grammarTermText(units[i].term);
      var previousTerm = units[i - 1].term;
      if (word === 'like' && this._grammarTermHasTag(previousTerm, 'Pronoun')) {
        units[i].role = GRAMMAR_ROLE_VERB;
        continue;
      }

      // `Computers connect us...` 的 connect 可能被 compromise 判成名詞。
      if (word === 'connect' && i + 1 < units.length &&
          this._grammarTermHasTag(previousTerm, 'Noun') &&
          this._grammarTermHasTag(units[i + 1].term, 'Pronoun')) {
        units[i].role = GRAMMAR_ROLE_VERB;
      }
    }
  };

  /**
   * 補強句首祈使句與引號內的動詞。
   * compromise 可能把 `Mark ...`、`Circle ...`、`Welcome!` 判成專有名詞，
   * 也可能把 `let the hammer slip` 的 let 判成名詞。
   * @param {Array<Object>} units - 可見詞彙單元
   */
  FlashcardApp.prototype._grammarApplyImperativeFallback = function(units) {
    for (var i = 0; i < units.length; i++) {
      if (units[i].role) continue;
      var word = this._grammarTermText(units[i].term);
      var nextTerm = i + 1 < units.length ? units[i + 1].term : null;
      var pre = units[i].term.pre || '';

      // 句首動詞後接受詞／子句時，是祈使句主要動詞。
      if (i === 0 && this._grammarIsCommonVerb(word) && nextTerm &&
          (this._grammarTermHasTag(nextTerm, 'Determiner') ||
           this._grammarTermHasTag(nextTerm, 'Noun') ||
           this._grammarTermHasTag(nextTerm, 'Pronoun'))) {
        units[i].role = GRAMMAR_ROLE_VERB;
        continue;
      }

      // 引號內的 `Welcome!` 是動詞，不是歡迎詞名詞。
      if (word === 'welcome' && /[\"“]/.test(pre)) {
        units[i].role = GRAMMAR_ROLE_VERB;
        continue;
      }

      // `let the hammer slip` / `let me go` 的 let 是使役動詞。
      if (word === 'let' && nextTerm &&
          this._grammarTermHasTag(nextTerm, 'Determiner')) {
        units[i].role = GRAMMAR_ROLE_VERB;
      }
    }
  };

  /**
   * 清除名詞位置的假陽性標注。
   * compromise 會把 `books`、`blocks`、`Christmas tree`、`firework show` 等
   * 名詞片語的一部分標成動詞；此處僅在明確名詞上下文才清除。
   * @param {Array<Object>} units - 可見詞彙單元
   */
  FlashcardApp.prototype._grammarApplyNounContextRules = function(units) {
    for (var i = 0; i < units.length; i++) {
      if (units[i].role !== GRAMMAR_ROLE_VERB) continue;

      var word = this._grammarTermText(units[i].term);
      var previous = i > 0 ? units[i - 1] : null;
      var next = i + 1 < units.length ? units[i + 1] : null;
      var previousTerm = previous ? previous.term : null;
      var nextTerm = next ? next.term : null;

      // `All my teammates...` 的 All 是限定詞。
      if (word === 'all' && nextTerm &&
          (this._grammarTermHasTag(nextTerm, 'Possessive') ||
           this._grammarTermHasTag(nextTerm, 'Noun') ||
           this._grammarTermHasTag(nextTerm, 'Pronoun'))) {
        units[i].role = null;
        continue;
      }

      // `Soon, the cat...` 的 Soon 是副詞。
      if (GRAMMAR_COMMON_ADVERBS[word] && i === 0 && nextTerm) {
        var afterNext = i + 2 < units.length ? units[i + 2] : null;
        var adverbFollowedByNoun =
          this._grammarTermHasTag(nextTerm, 'Noun') ||
          (this._grammarTermHasTag(nextTerm, 'Determiner') && afterNext &&
           this._grammarTermHasTag(afterNext.term, 'Noun'));
        if (adverbFollowedByNoun) {
          units[i].role = null;
          continue;
        }
      }

      // `What was the weather like when...?` 的 like 是介詞。
      if (word === 'like' && previousTerm && nextTerm &&
          this._grammarTermHasTag(previousTerm, 'Noun')) {
        var likeNextWord = this._grammarTermText(nextTerm);
        var likeIsPreposition = likeNextWord === 'when' || likeNextWord === 'what' ||
          likeNextWord === 'that' || likeNextWord === 'which';
        if (!likeIsPreposition) continue;
        units[i].role = null;
        continue;
      }

      // `nothing to do` 的 do 是名詞，不是動詞。
      if (word === 'do' && previousTerm && i >= 2) {
        var nominalObject = units[i - 2];
        if (this._grammarTermText(previous.term) === 'to' &&
            this._grammarTermHasTag(previous.term, 'Conjunction') &&
            this._grammarTermHasTag(nominalObject.term, 'Noun')) {
          var nominalWord = this._grammarTermText(nominalObject.term);
          if (nominalWord === 'nothing' || nominalWord === 'something' ||
              nominalWord === 'anything' || nominalWord === 'everything' ||
              nominalWord === 'none') {
            units[i].role = null;
            continue;
          }
        }
      }

      // `the better ...` 的 better 是比較級形容詞。
      if (word === 'better' && previousTerm &&
          this._grammarTermHasTag(previousTerm, 'Determiner')) {
        units[i].role = null;
        continue;
      }

      // 過去分詞作為名詞後置修飾語，不是句中主要動詞。
      if (word === 'made' && previousTerm && nextTerm &&
          this._grammarTermText(previousTerm) === 'items' &&
          this._grammarTermText(nextTerm) === 'of') {
        units[i].role = null;
        continue;
      }
      if (word === 'called' && previousTerm && nextTerm &&
          this._grammarTermText(previousTerm) === 'way' &&
          this._grammarTermHasTag(nextTerm, 'Determiner')) {
        units[i].role = null;
        continue;
      }

      // `rent shared bikes` 的 shared 是修飾名詞的形容詞。
      if (word === 'shared' && next &&
          this._grammarTermText(next.term) === 'bikes') {
        units[i].role = null;
        continue;
      }

      // `whale watching` 的 watching 是名詞化的 gerund，不是句中動詞。
      if (previousTerm && this._grammarTermHasTag(previousTerm, 'Noun') &&
          previous.role !== GRAMMAR_ROLE_BE &&
          previous.role !== GRAMMAR_ROLE_AUXILIARY &&
          !this._grammarTermHasTag(previousTerm, 'Pronoun') &&
          this._grammarTermHasTag(units[i].term, 'Gerund') &&
          (!nextTerm || this._grammarTermHasTag(nextTerm, 'Preposition'))) {
        units[i].role = null;
        continue;
      }

      if (!GRAMMAR_NOUN_CONTEXT_WORDS[word]) continue;

      var previousIsModifier = previousTerm &&
        (this._grammarTermHasTag(previousTerm, 'Determiner') ||
         this._grammarTermHasTag(previousTerm, 'Adjective') ||
         this._grammarTermHasTag(previousTerm, 'Adverb') ||
         this._grammarTermHasTag(previousTerm, 'Noun') ||
         this._grammarTermHasTag(previousTerm, 'Preposition'));
      var nextIsNoun = nextTerm && this._grammarTermHasTag(nextTerm, 'Noun');
      var atEnd = !nextTerm;

      if (previousIsModifier && (atEnd || nextIsNoun)) {
        units[i].role = null;
        continue;
      }

      // `What summer plans do you have?` 的 plans 是名詞。
      if (word === 'plans' && previousTerm && nextTerm &&
          this._grammarTermHasTag(previousTerm, 'Noun') &&
          (this._grammarTermText(next.term) === 'do' ||
           this._grammarTermText(next.term) === 'does' ||
           this._grammarTermText(next.term) === 'did')) {
        units[i].role = null;
        continue;
      }

      // `shared bikes to ...` 的 bikes 是名詞。
      if (word === 'bikes' && previousTerm && nextTerm &&
          this._grammarTermHasTag(previousTerm, 'PastTense') &&
          this._grammarTermText(next.term) === 'to') {
        units[i].role = null;
      }
    }
  };

  /**
   * 依 BE 動詞的實際功能分類：
   * - BE + V-ing / 被動式：BE 是助動詞（auxiliary）。
   * - BE + 形容詞／名詞補語：BE 是 BE 動詞（be）。
   * @param {Array<Object>} units - 可見詞彙單元
   */
  FlashcardApp.prototype._grammarApplyBeFunctionRules = function(units) {
    for (var i = 0; i < units.length; i++) {
      if (units[i].role !== GRAMMAR_ROLE_BE) continue;
      var targetIndex = this._grammarNextContentIndex(units, i + 1);
      if (targetIndex < 0) continue;

      var target = units[targetIndex];
      var targetWord = this._grammarTermText(target.term);
      var isGerund = this._grammarTermHasTag(target.term, 'Gerund');
      var isParticiple = this._grammarTermHasTag(target.term, 'Participle');
      var isPastTense = this._grammarTermHasTag(target.term, 'PastTense');
      var looksLikeGerund = isGerund ||
        (this._grammarTermHasTag(target.term, 'Adjective') &&
         /ing$/.test(targetWord) && !GRAMMAR_PREDICATE_ADJECTIVES[targetWord]);

      // 已知的主語補語形容詞優先，即使 compromise 將其標為 Gerund。
      if (GRAMMAR_PREDICATE_ADJECTIVES[targetWord]) {
        target.role = null;
        continue;
      }

      if (looksLikeGerund) {
        units[i].role = GRAMMAR_ROLE_AUXILIARY;
        target.role = GRAMMAR_ROLE_VERB;
        continue;
      }

      // BE + 主詞 + V-ing，例如 `What are you thinking?`、`She was jogging.`。
      if (this._grammarTermHasTag(target.term, 'Pronoun') ||
          this._grammarTermHasTag(target.term, 'Person') ||
          this._grammarTermHasTag(target.term, 'Noun')) {
        var afterSubjectIndex = this._grammarNextContentIndex(units, targetIndex + 1);
        if (afterSubjectIndex >= 0) {
          var afterSubjectWord = this._grammarTermText(units[afterSubjectIndex].term);
          var afterSubjectIsGerund =
            this._grammarTermHasTag(units[afterSubjectIndex].term, 'Gerund') ||
            ((this._grammarTermHasTag(units[afterSubjectIndex].term, 'Verb') ||
              this._grammarTermHasTag(units[afterSubjectIndex].term, 'Adjective')) &&
             /ing$/.test(afterSubjectWord) &&
             !GRAMMAR_PREDICATE_ADJECTIVES[afterSubjectWord]);
          if (afterSubjectIsGerund) {
            units[i].role = GRAMMAR_ROLE_AUXILIARY;
            units[afterSubjectIndex].role = GRAMMAR_ROLE_VERB;
            continue;
          }
        }
      }

      if (isParticiple || isPastTense) {
        if (GRAMMAR_PREDICATE_ADJECTIVES[targetWord]) {
          // `I am glad` / `The animal is stuck`：BE 是系動詞，後方是形容詞。
          target.role = null;
        } else {
          // `was called` / `is made`：BE 是被動式助動詞。
          units[i].role = GRAMMAR_ROLE_AUXILIARY;
          target.role = GRAMMAR_ROLE_VERB;
        }
        continue;
      }

      if (target.role === GRAMMAR_ROLE_VERB &&
          GRAMMAR_PREDICATE_ADJECTIVES[targetWord]) {
        target.role = null;
      }
    }
  };

  /**
   * 分析英文文字，回傳語法角色標注範圍。
   * compromise 會將多句文字拆成多個 sentence；每個句子都必須獨立分析，
   * 再依原文字元位置合併，才能完整標注問答型等多句卡片。
   * @param {string} text - 英文文字
   * @returns {Array<{start:number,end:number,text:string,role:string}>}
   */
  FlashcardApp.prototype.getGrammarAnnotations = function(text) {
    var annotations = [];
    if (!text || typeof window.nlp !== 'function') return annotations;

    try {
      var parsed = window.nlp(text).json();
      if (!parsed || !parsed.length) return annotations;

      var cursor = 0;
      for (var sentenceIndex = 0; sentenceIndex < parsed.length; sentenceIndex++) {
        var parsedSentence = parsed[sentenceIndex];
        var terms = parsedSentence && parsedSentence.terms;
        if (!terms || !terms.length) continue;

        var sentenceStart = cursor;
        var units = [];
        var previousUnit = null;

        for (var i = 0; i < terms.length; i++) {
          var term = terms[i];
          var pre = term.pre || '';
          var termText = term.text || '';
          var post = term.post || '';

          if (termText) {
            var unit = {
              term: term,
              start: cursor + pre.length,
              end: cursor + pre.length + termText.length,
              role: this._grammarRoleForTerm(term)
            };
            units.push(unit);
            previousUnit = unit;
          } else if (previousUnit && !previousUnit.role) {
            // 縮寫中的隱藏詞（如 I'm → am、I've → have）沿用前一個可見詞。
            var implicitRole = this._grammarRoleForTerm({
              text: term.implicit || '',
              tags: term.tags || []
            });
            if (implicitRole) previousUnit.role = implicitRole;
          }

          cursor += pre.length + termText.length + post.length;
        }

        // 每句獨立套用文法规則，避免上一句的主詞、modal 或 BE 影響下一句。
        var sentenceText = parsedSentence.text || text.substring(sentenceStart, cursor);
        this._grammarApplyDoQuestion(units, sentenceText);
        this._grammarApplyModalFallback(units);
        this._grammarApplyCommonVerbFallback(units);
        this._grammarApplyImperativeFallback(units);
        this._grammarApplyNounContextRules(units);
        this._grammarApplyContextualAdjectives(units);
        this._grammarApplyBeFunctionRules(units);
        this._grammarApplyPhraseAuxiliaries(units);

        for (var u = 0; u < units.length; u++) {
          if (!units[u].role) continue;
          annotations.push({
            start: units[u].start,
            end: units[u].end,
            text: text.substring(units[u].start, units[u].end),
            role: units[u].role
          });
        }
      }
    } catch (e) {
      console.warn('英文語法角色分析失敗（不影響卡片顯示）:', e);
      return [];
    }

    return annotations;
  };

  /**
   * 將語法角色標注渲染到元素；只建立文字節點與 span，避免 HTML 注入。
   * @param {HTMLElement} element - 目標文字元素
   * @param {string} text - 原始英文文字
   */
  FlashcardApp.prototype.renderGrammarAnnotations = function(element, text) {
    if (!element) return;
    var source = String(text || '');
    var annotations = this.getGrammarAnnotations(source);

    element.textContent = '';
    element.classList.toggle('word-empty', source === '');

    var cursor = 0;
    for (var i = 0; i < annotations.length; i++) {
      var annotation = annotations[i];
      if (annotation.start > cursor) {
        element.appendChild(document.createTextNode(source.substring(cursor, annotation.start)));
      }

      var span = document.createElement('span');
      if (annotation.role === GRAMMAR_ROLE_VERB) {
        span.className = 'grammar-verb';
      } else if (annotation.role === GRAMMAR_ROLE_AUXILIARY) {
        span.className = 'grammar-auxiliary';
      } else if (annotation.role === GRAMMAR_ROLE_BE) {
        span.className = 'grammar-be';
      }
      span.textContent = annotation.text;
      element.appendChild(span);
      cursor = annotation.end;
    }

    if (cursor < source.length) {
      element.appendChild(document.createTextNode(source.substring(cursor)));
    }
  };

  /**
   * 判斷單字是否為完整句子。只有句子需要語法角色標注，
   * 單字、片語與單字型態列表維持純文字。
   * @param {Object} word - 單字物件
   * @returns {boolean}
   */
  FlashcardApp.prototype.shouldAnnotateGrammar = function(word) {
    if (!word || !word.english) return false;
    return typeof getWordType === 'function' && getWordType(word.english) === 'sentence';
  };

  /**
   * 依設定設定文字；只有完整句子且功能開啟時顯示語法標注，
   * 其餘情況（單字、片語）顯示純文字。
   * @param {HTMLElement} element - 目標文字元素
   * @param {string} text - 原始英文文字
   */
  FlashcardApp.prototype.setGrammarAnnotatedText = function(element, text) {
    if (!element) return;
    var isSentence = typeof getWordType === 'function' && getWordType(text) === 'sentence';
    if (this.settings && this.settings.grammarAnnotationEnabled === false) {
      this.setCardText(element, text);
      return;
    }
    if (!isSentence) {
      this.setCardText(element, text);
      return;
    }
    this.renderGrammarAnnotations(element, text);
  };

  /**
   * 顯示／隱藏主畫面的語法角色圖例。
   * 只有目前卡片是完整句子時才顯示圖例。
   */
  FlashcardApp.prototype.updateGrammarLegendVisibility = function() {
    var legend = document.getElementById('grammar-legend');
    if (!legend) return;
    var enabled = !(this.settings && this.settings.grammarAnnotationEnabled === false);
    var currentWord = this.currentWords && this.currentWords.length ?
      this.currentWords[this.currentIndex] : null;
    var isSentence = this.shouldAnnotateGrammar(currentWord);
    legend.classList.toggle('show', enabled && isSentence);
  };
</script>
