<script>
  // ES5兼容版本 FlashcardApp for iPad4
  (function() {
    'use strict';

    // 上線環境靜音 console.log（250 處除錯訊息不輸出到使用者瀏覽器）。
    // - console.warn / console.error 保留：出問題時瀏覽器主控台仍有線索
    // - 在 Web App 網址加上 ?debug=1（或 &debug=1）可重新開啟全部 log
    // - Jest 測試環境不靜音，避免測試輸出被吃掉
    (function() {
      var isTestEnv = false;
      try {
        isTestEnv = (typeof jest !== 'undefined') ||
                   (typeof process !== 'undefined' && process.env && process.env.NODE_ENV === 'test');
      } catch (envError) {}
      var debugMode = false;
      try {
        debugMode = /[?&]debug(=1|=true|&|$)/.test(window.location.search || '');
      } catch (debugError) {}
      if (!isTestEnv && !debugMode && window.console && typeof window.console.log === 'function') {
        window.console.log = function() {};
      }
    })();

    // ES5 Polyfills
    if (!Array.prototype.forEach) {
      Array.prototype.forEach = function(callback, thisArg) {
        for (var i = 0; i < this.length; i++) {
          callback.call(thisArg, this[i], i, this);
        }
      };
    }
    
    if (!Array.prototype.filter) {
      Array.prototype.filter = function(callback, thisArg) {
        var result = [];
        for (var i = 0; i < this.length; i++) {
          if (callback.call(thisArg, this[i], i, this)) {
            result.push(this[i]);
          }
        }
        return result;
      };
    }
    
    if (!Array.prototype.map) {
      Array.prototype.map = function(callback, thisArg) {
        var result = [];
        for (var i = 0; i < this.length; i++) {
          result.push(callback.call(thisArg, this[i], i, this));
        }
        return result;
      };
    }
    
    if (!Array.prototype.find) {
      Array.prototype.find = function(callback, thisArg) {
        for (var i = 0; i < this.length; i++) {
          if (callback.call(thisArg, this[i], i, this)) {
            return this[i];
          }
        }
        return undefined;
      };
    }
    
    if (!Array.prototype.includes) {
      // 依 ES2016 規範：支援 fromIndex（負值從尾端偏移）與 SameValueZero
      // （NaN === NaN 視為相等）——未來若有呼叫端用到才不會踩到 shim 偏差
      Array.prototype.includes = function(searchElement) {
        var fromIndex = arguments.length > 1 ? Number(arguments[1]) : 0;
        if (isNaN(fromIndex)) fromIndex = 0;
        if (fromIndex < 0) fromIndex = Math.max(0, this.length + fromIndex);
        for (var i = fromIndex; i < this.length; i++) {
          var v = this[i];
          // SameValueZero：NaN 與 NaN 視為相同（嚴格相等 === 會漏掉）
          if (v === searchElement || (v !== v && searchElement !== searchElement)) {
            return true;
          }
        }
        return false;
      };
    }
  })();
</script>
